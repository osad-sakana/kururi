<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kururi Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- input() の入力待ちに SharedArrayBuffer を使う。公開先でも動くよう、必要なヘッダーをサービスワーカーで付ける（MIT） -->
    <script src="%BASE_URL%coi-serviceworker.js"></script>
  </head>
  <body>
    <header>
      <h1>Kururi</h1>
      <span id="status" role="status"></span>
      <button id="run" type="button" disabled>実行</button>
      <button id="stop" type="button" hidden>止める</button>
      <button id="open-narapy" type="button" disabled>narapy で開く</button>
    </header>
    <main>
      <section aria-label="Kururi">
        <div id="editor"></div>
      </section>
      <section aria-label="Python と実行結果" class="right">
        <div id="python" aria-label="Python（編集できません）"></div>
        <div id="console">
          <pre id="output" aria-label="実行結果" aria-live="polite"></pre>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
